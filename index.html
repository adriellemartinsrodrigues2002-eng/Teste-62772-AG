<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Zombie Run - Adrielle & Gabriel</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#08060d;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#menu{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
  background:
    radial-gradient(circle at center,#42134c,#09060d 65%);
}

.title{
  font-size:clamp(38px,11vw,70px);
  font-weight:900;
  color:#d75cff;
  text-shadow:0 0 25px #a000ff;
  margin:0;
}

.subtitle{
  color:#bbb;
  margin:10px 0 35px;
}

.choose{
  font-size:18px;
  margin-bottom:15px;
}

.characterChoices{
  display:flex;
  gap:15px;
  width:100%;
  max-width:500px;
}

.characterButton{
  flex:1;
  padding:20px 10px;
  border:2px solid #702080;
  border-radius:18px;
  background:#160c1c;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.characterButton:active{
  transform:scale(.96);
}

.avatar{
  display:block;
  font-size:60px;
  margin-bottom:8px;
}

#game{
  display:none;
  height:100vh;
  width:100%;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(to bottom,transparent 55%,#09070b),
    radial-gradient(circle at 50% 25%,#512257,#120b18 60%);
}

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:16px;
}

.hudBox{
  background:rgba(0,0,0,.6);
  border:1px solid #71317f;
  border-radius:10px;
  padding:8px 12px;
}

#moon{
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  background:#eee;
  box-shadow:0 0 30px white;
  top:75px;
  right:15%;
}

#ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:90px;
  background:
    repeating-linear-gradient(
      90deg,
      #17121b 0 35px,
      #211825 35px 38px
    );
  border-top:3px solid #48224f;
}

#player{
  position:absolute;
  bottom:90px;
  left:18%;
  width:70px;
  height:80px;
  font-size:65px;
  z-index:10;
  transition:left .1s;
}

#zombie{
  position:absolute;
  bottom:90px;
  left:4%;
  width:70px;
  height:80px;
  font-size:65px;
  z-index:9;
}

.obstacle{
  position:absolute;
  bottom:90px;
  width:40px;
  height:55px;
  background:#68432e;
  border:3px solid #392017;
  border-radius:8px 8px 3px 3px;
  z-index:8;
}

.obstacle:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  background:#7c5237;
  left:7px;
  top:7px;
  border-radius:50%;
}

#message{
  position:absolute;
  top:75px;
  left:0;
  right:0;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#ffd65c;
  z-index:20;
  text-shadow:0 2px 5px black;
}

#jumpButton{
  position:absolute;
  bottom:25px;
  right:20px;
  z-index:30;
  width:125px;
  height:70px;
  border-radius:20px;
  border:2px solid #d75cff;
  background:linear-gradient(#8b28a5,#42124f);
  color:white;
  font-size:20px;
  font-weight:900;
  box-shadow:0 5px 0 #210b29;
}

#jumpButton:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #210b29;
}

#gameOver{
  display:none;
  position:absolute;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.88);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

#gameOver h2{
  font-size:48px;
  color:#ff3d55;
  margin:0 0 10px;
}

#finalScore{
  font-size:25px;
  margin-bottom:25px;
}

.restart{
  padding:16px 25px;
  border:0;
  border-radius:14px;
  background:#8b28a5;
  color:white;
  font-size:18px;
  font-weight:bold;
}

</style>
</head>

<body>

<div id="menu">

  <h1 class="title">ZOMBIE RUN</h1>

  <div class="subtitle">
    🧟‍♂️ FUGA DOS ZUMBIS 🧟‍♀️
  </div>

  <div class="choose">
    Escolha seu personagem
  </div>

  <div class="characterChoices">

    <button class="characterButton" onclick="startGame('adrielle')">
      <span class="avatar">🧟‍♀️</span>
      ADRIELLE
    </button>

    <button class="characterButton" onclick="startGame('gabriel')">
      <span class="avatar">🧟</span>
      GABRIEL
    </button>

  </div>

</div>


<div id="game">

  <div id="hud">

    <div class="hudBox">
      🏆 Pontos: <span id="score">0</span>
    </div>

    <div class="hudBox">
      🧟 Distância: <span id="distance">0</span>m
    </div>

  </div>

  <div id="message">
    CORRA!
  </div>

  <div id="moon"></div>

  <div id="ground"></div>

  <div id="zombie">🧟‍♂️</div>

  <div id="player">🧟‍♀️</div>

  <button id="jumpButton" onclick="jump()">
    👆 PULAR
  </button>


  <div id="gameOver">

    <h2>GAME OVER</h2>

    <div id="finalScore">
      Pontos: 0
    </div>

    <button class="restart" onclick="restartGame()">
      🔥 JOGAR NOVAMENTE
    </button>

  </div>

</div>


<script>

let playerName="adrielle";

let playerEmoji="🧟‍♀️";

let playerY=0;

let velocityY=0;

let gravity=.9;

let jumping=false;

let gameRunning=false;

let score=0;

let distance=0;

let speed=5;

let obstacleTimer=0;

let zombieDistance=0;

let obstacles=[];

let gameLoop;


function startGame(name){

  playerName=name;

  if(name==="adrielle"){

    playerEmoji="🧟‍♀️";

  }else{

    playerEmoji="🧟";

  }

  document.getElementById("menu").style.display="none";

  document.getElementById("game").style.display="block";

  document.getElementById("player").textContent=playerEmoji;

  resetGame();

  gameRunning=true;

  gameLoop=requestAnimationFrame(updateGame);

}


function resetGame(){

  score=0;

  distance=0;

  speed=5;

  playerY=0;

  velocityY=0;

  jumping=false;

  zombieDistance=0;

  obstacleTimer=0;

  obstacles=[];

  document.getElementById("score").textContent="0";

  document.getElementById("distance").textContent="0";

  document.getElementById("zombie").style.left="4%";

  document.getElementById("player").style.bottom="90px";

  document.getElementById("gameOver").style.display="none";

  document.querySelectorAll(".obstacle").forEach(function(o){

    o.remove();

  });

}


function jump(){

  if(!gameRunning)return;

  if(jumping)return;

  jumping=true;

  velocityY=16;

}


function updateGame(){

  if(!gameRunning)return;

  velocityY-=gravity;

  playerY+=velocityY;

  if(playerY<=0){

    playerY=0;

    velocityY=0;

    jumping=false;

  }

  document.getElementById("player").style.bottom=

    (90+playerY)+"px";


  obstacleTimer-=1;

  if(obstacleTimer<=0){

    createObstacle();

    obstacleTimer=80+Math.random()*70;

  }


  for(let i=obstacles.length-1;i>=0;i--){

    let obstacle=obstacles[i];

    obstacle.x-=speed;

    obstacle.element.style.left=obstacle.x+"px";

    if(obstacle.x<-60){

      obstacle.element.remove();

      obstacles.splice(i,1);

      score+=10;

    }

  }


  checkCollision();


  distance+=.1;

  score+=1;

  speed+=.0008;

  zombieDistance+=.015;


  document.getElementById("score").textContent=

    Math.floor(score);

  document.getElementById("distance").textContent=

    Math.floor(distance);


  let zombie=

    document.getElementById("zombie");

  let zombieLeft=

    4+zombieDistance;

  if(zombieLeft>12){

    zombieLeft=12;

  }

  zombie.style.left=zombieLeft+"%";


  gameLoop=requestAnimationFrame(updateGame);

}


function createObstacle(){

  let obstacle=document.createElement("div");

  obstacle.className="obstacle";

  obstacle.style.left="100%";

  document.getElementById("game").appendChild(obstacle);

  obstacles.push({

    element:obstacle,

    x:window.innerWidth

  });

}


function checkCollision(){

  let playerLeft=

    window.innerWidth*.18;

  let playerRight=

    playerLeft+60;

  let playerBottom=

    90+playerY;

  let playerTop=

    playerBottom+65;


  for(let obstacle of obstacles){

    let obstacleLeft=obstacle.x;

    let obstacleRight=obstacle.x+40;

    let obstacleTop=145;


    if(

      playerRight>obstacleLeft &&

      playerLeft<obstacleRight &&

      playerBottom<145 &&

      playerTop>90

    ){

      gameOver();

    }

  }

}


function gameOver(){

  gameRunning=false;

  cancelAnimationFrame(gameLoop);

  document.getElementById("finalScore").textContent=

    "Pontos: "+Math.floor(score)+

    " | Distância: "+Math.floor(distance)+"m";

  document.getElementById("gameOver").style.display="flex";

}


function restartGame(){

  resetGame();

  gameRunning=true;

  gameLoop=requestAnimationFrame(updateGame);

}


document.addEventListener("keydown",function(event){

  if(event.code==="Space"){

    event.preventDefault();

    jump();

  }

});


let touchStartY=0;

document.addEventListener("touchstart",function(event){

  touchStartY=event.touches[0].clientY;

},{passive:true});


document.addEventListener("touchend",function(event){

  let touchEndY=event.changedTouches[0].clientY;

  if(touchStartY-touchEndY>40){

    jump();

  }

},{passive:true});

</script>

</body>
</html>
